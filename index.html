<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo sí soy celoso</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .box {
            display: none;
            background: #161b22;
            border: 2px solid #58a6ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: popUp 0.3s ease-out forwards;
        }
        .box.active {
            display: block;
        }
        h2 {
            font-size: 2rem;
            color: #58a6ff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.4);
        }
        button:hover {
            background-color: #2ea043;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.98);
        }
        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Yo -->
        <div id="step-0" class="box active">
            <h2>Yo</h2>
            <button onclick="nextStep(1)">👾 Siguiente</button>
        </div>

        </div>

        <!-- soy -->
        <div id="step-10" class="box">
            <h2>soy</h2>
            <button onclick="nextStep(11)">🕹️ Siguiente</button>
        </div>

        </div>

        <!-- corazon -->
        <div id="step-20" class="box">
            <h2>corazon</h2>
            <button onclick="restart()">🔄 Reiniciar</button>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const totalSteps = 21;

        function nextStep(step) {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep = step;
            if (currentStep < totalSteps) {
                document.getElementById(`step-${currentStep}`).classList.add('active');
            }
        }

        function restart() {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep = 0;
            document.getElementById(`step-${currentStep}`).classList.add('active');
        }
    </script>

</body>
</html>
