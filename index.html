<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo sí soy celoso</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .box {
            display: none;
            background: #161b22;
            border: 2px solid #58a6ff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            animation: popUp 0.2s ease-out forwards;
        }
        .box.active {
            display: block;
        }
        h2 {
            font-size: 2rem;
            color: #58a6ff;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.4);
        }
        button:hover {
            background-color: #2ea043;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-auto {
            background-color: #1f6feb;
            box-shadow: 0 4px 10px rgba(31, 111, 235, 0.4);
        }
        .btn-auto:hover {
            background-color: #388bfd;
        }
        #youtube-player {
            display: none;
        }
        @keyframes popUp {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Reproductor oculto de YouTube -->
    <div id="youtube-player"></div>

    <div class="container">
        <!-- Ventanas individuales -->
        <div id="step-0" class="box active">
            <h2>No</h2>
            <div class="buttons">
                <button onclick="nextStep(1)">👾 Siguiente</button>
            </div>
        </div>

        <div id="step-1" class="box">
            <h2>No</h2>
            <div class="buttons">
                <button onclick="nextStep(2)">⚡ Siguiente</button>
            </div>
        </div>

        <div id="step-2" class="box">
            <h2>No</h2>
            <div class="buttons">
                <button onclick="nextStep(3)">🕹️ Siguiente</button>
            </div>
        </div>

        <div id="step-3" class="box">
            <h2>Yo sí soy celoso</h2>
            <div class="buttons">
                <button onclick="nextStep(4)">🔮 Siguiente</button>
            </div>
        </div>

        <div id="step-4" class="box">
            <h2>Pero</h2>
            <div class="buttons">
                <button onclick="nextStep(5)">👾 Siguiente</button>
            </div>
        </div>

        <div id="step-5" class="box">
            <h2>Quien es ese kabron</h2>
            <div class="buttons">
                <button onclick="nextStep(6)">⚡ Siguiente</button>
            </div>
        </div>

        <div id="step-6" class="box">
            <h2>Dime</h2>
            <div class="buttons">
                <button onclick="nextStep(7)">🕹️ Siguiente</button>
            </div>
        </div>

        <div id="step-7" class="box">
            <h2>¿Quien es ese kabron?</h2>
            <div class="buttons">
                <button onclick="nextStep(8)">🔮 Siguiente</button>
            </div>
        </div>

        <div id="step-8" class="box">
            <h2>Tranquila</h2>
            <div class="buttons">
                <button onclick="nextStep(9)">👾 Siguiente</button>
            </div>
        </div>

        <div id="step-9" class="box">
            <h2>No soy psycho</h2>
            <div class="buttons">
                <button onclick="nextStep(10)">⚡ Siguiente</button>
            </div>
        </div>

        <div id="step-10" class="box">
            <h2>No voy a hacer un papelón</h2>
            <div class="buttons">
                <button onclick="nextStep(11)">🕹️ Siguiente</button>
            </div>
        </div>

        <div id="step-11" class="box">
            <h2>Pero</h2>
            <div class="buttons">
                <button onclick="nextStep(12)">🔮 Siguiente</button>
            </div>
        </div>

        <div id="step-12" class="box">
            <h2>Ouch mi corazon</h2>
            <div class="buttons">
                <button onclick="restart()">🔄 Reiniciar</button>
                <button class="btn-auto" onclick="startShow()">▶️ Reproducir con Música</button>
            </div>
        </div>
    </div>

    <!-- Script de la API de IFrame de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentStep = 0;
        const totalSteps = 13;
        let timeoutId = null;

        // Duraciones personalizadas (en milisegundos) para cada paso según el ritmo de la canción
        // Puedes ajustar estos números si un paso dura más o menos tiempo
        const stepDurations = [
            400,  // No 1
            400,  // No 2
            400,  // No 3
            1200, // Yo sí soy celoso
            500,  // Pero
            900,  // Quien es ese kabron
            400,  // Dime
            1000, // ¿Quien es ese kabron?
            600,  // Tranquila
            800,  // No soy psycho
            1200, // No voy a hacer un papelón
            500,  // Pero
            1000  // Ouch mi corazon
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'kLUeP9E9f5k', // Video de YouTube integrado
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'start': 45 // Cambia este número si quieres que el video empiece en otro segundo exacto (ej. donde empieza la letra)
                }
            });
        }

        function nextStep(step) {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep = step;
            if (currentStep < totalSteps) {
                document.getElementById(`step-${currentStep}`).classList.add('active');
            }
        }

        function restart() {
            if (timeoutId) clearTimeout(timeoutId);
            if (player && player.stopVideo) {
                player.stopVideo();
            }
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep = 0;
            document.getElementById(`step-${currentStep}`).classList.add('active');
        }

        // Función recursiva que avanza cada paso respetando su propio tiempo (sincronización precisa)
        function runSequence() {
            if (currentStep < totalSteps - 1) {
                let delay = stepDurations[currentStep];
                timeoutId = setTimeout(() => {
                    nextStep(currentStep + 1);
                    runSequence();
                }, delay);
            }
        }

        function startShow() {
            restart();
            if (player && player.playVideo) {
                player.playVideo();
            }
            runSequence();
        }
    </script>

</body>
</html>
