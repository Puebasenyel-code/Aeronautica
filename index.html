<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo sí soy celoso</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .box {
            display: none;
            background: #161b22;
            border: 2px solid #58a6ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: popUp 0.3s ease-out forwards;
        }
        .box.active {
            display: block;
        }
        h2 {
            font-size: 1.5rem;
            color: #58a6ff;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.4);
        }
        button:hover {
            background-color: #2ea043;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.98);
        }
        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ventana 1 -->
        <div id="step-0" class="box active">
            <h2>Yo sí soy celoso, pero... ¿quién es ese cabrón?</h2>
            <button onclick="nextStep(1)">👾 Siguiente</button>
        </div>

        <!-- Ventana 2 -->
        <div id="step-1" class="box">
            <h2>Dime quién es ese cabrón</h2>
            <button onclick="nextStep(2)">⚡ Continuar</button>
        </div>

        <!-- Ventana 3 -->
        <div id="step-2" class="box">
            <h2>Tranquila, no soy psycho</h2>
            <button onclick="nextStep(3)">🕹️ Siguiente</button>
        </div>

        <!-- Ventana 4 -->
        <div id="step-3" class="box">
            <h2>No voy a hacer un papelón</h2>
            <button onclick="nextStep(4)">🔮 Continuar</button>
        </div>

        <!-- Ventana 5 -->
        <div id="step-4" class="box">
            <h2>Pero, mi corazón...</h2>
            <button onclick="restart()">🔄 Reiniciar</button>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const totalSteps = 5;

        function nextStep(step) {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep = step;
            if (currentStep < totalSteps) {
                document.getElementById(`step-${currentStep}`).classList.add('active');
            }
        }

        function restart() {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep = 0;
            document.getElementById(`step-${currentStep}`).classList.add('active');
        }
    </script>

</body>
</html>
